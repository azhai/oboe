<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>odlog — log explorer</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #10151d;
    --panel-2: #151b25;
    --border: #232c3b;
    --border-soft: #1a222e;
    --text: #d7e0ee;
    --muted: #7c8ba3;
    --accent: #54e6a4;
    --accent-dim: #2e7d5b;
    --blue: #62b0ff;
    --amber: #ffc857;
    --red: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 500px at 20% -10%, #12202a 0%, var(--bg) 55%);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 22px 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 650;
    font-size: 16px;
    letter-spacing: 0.4px;
  }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .brand small { color: var(--muted); font-weight: 500; letter-spacing: 0; font-size: 11px; }
  .stats { color: var(--muted); font-family: var(--mono); font-size: 11px; display: flex; gap: 14px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; }
  main { flex: 1; padding: 0 22px 20px; display: flex; flex-direction: column; min-height: 0; }
  .toolbar {
    display: flex; gap: 8px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .toolbar .prompt { color: var(--accent); font-family: var(--mono); padding-left: 6px; }
  #q {
    flex: 1; min-width: 120px;
    background: transparent; border: 0; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 13px;
    padding: 7px 4px;
  }
  #q::placeholder { color: #4d5b70; }
  select, button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 9px;
    font: inherit;
    font-size: 12px;
    outline: none;
  }
  select:hover, button:hover { border-color: #33415a; }
  button.primary {
    background: linear-gradient(180deg, #2f9e74, #257a58);
    border-color: #2f9e74;
    color: #eafff5;
    font-weight: 600;
    padding: 7px 16px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: progress; }
  .auto { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; padding: 0 4px; cursor: pointer; user-select: none; }
  .auto input { accent-color: var(--accent); }
  .examples { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 2px 0; }
  .examples button {
    padding: 3px 9px; font-family: var(--mono); font-size: 11px;
    background: transparent; color: var(--muted); border-color: var(--border-soft);
  }
  .examples button:hover { color: var(--accent); border-color: var(--accent-dim); }
  .meta {
    display: flex; gap: 16px; flex-wrap: wrap;
    color: var(--muted); font-family: var(--mono); font-size: 11px;
    padding: 10px 4px 8px;
  }
  .meta .err { color: var(--red); }
  .meta b { color: var(--text); font-weight: 600; }
  .results {
    flex: 1; min-height: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    overflow: auto;
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: #121924;
    border-bottom: 1px solid var(--border);
    text-align: left;
    padding: 8px 12px;
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  tbody td { padding: 6px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  tbody tr.log { cursor: pointer; }
  tbody tr.log:hover td { background: #131b26; }
  td.time {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    white-space: nowrap; width: 1%;
  }
  td.msg { font-family: var(--mono); font-size: 12.5px; color: #e8eef8; word-break: break-word; }
  td.num { font-family: var(--mono); text-align: right; color: var(--accent); }
  td.str { font-family: var(--mono); font-size: 12px; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 5px;
    background: #161d28;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 7px;
    font-family: var(--mono);
    font-size: 11px;
    max-width: 340px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip .k { color: var(--muted); }
  .chip .v { color: #cdd9ea; }
  .chip.lvl-error { border-color: #5a2a2a; background: #241417; }
  .chip.lvl-error .v { color: var(--red); }
  .chip.lvl-warn, .chip.lvl-warning { border-color: #5a4825; background: #241f13; }
  .chip.lvl-warn .v, .chip.lvl-warning .v { color: var(--amber); }
  .chip.lvl-info { border-color: #24405a; background: #131d24; }
  .chip.lvl-info .v { color: var(--blue); }
  .detail td { background: #0d131c; padding: 0; }
  .detail pre {
    margin: 0; padding: 12px 16px;
    font-family: var(--mono); font-size: 11.5px; color: #a9bad2;
    white-space: pre-wrap; word-break: break-word;
  }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  tr.flash td { animation: flash 0.6s ease-out; }
  @keyframes flash { from { background: #1c2b25; } to { background: transparent; } }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #24303f; border-radius: 8px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 720px) {
    header { flex-wrap: wrap; gap: 8px; }
    main { padding: 0 10px 12px; }
    .toolbar { flex-wrap: wrap; }
    #q { flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> odlog <small>log explorer</small></div>
  <div class="stats" id="stats"><span>connecting…</span></div>
</header>
<main>
  <div class="toolbar">
    <span class="prompt">›</span>
    <input id="q" type="text" spellcheck="false" placeholder='LogsQL, e.g. level:error service:api | sort by (_time) desc' value='* | sort by (_time) desc'>
    <select id="range" title="time range">
      <option value="300">5m</option>
      <option value="900">15m</option>
      <option value="3600" selected>1h</option>
      <option value="21600">6h</option>
      <option value="86400">24h</option>
      <option value="604800">7d</option>
      <option value="0">all</option>
    </select>
    <select id="limit" title="row limit">
      <option>100</option>
      <option selected>1000</option>
      <option>5000</option>
      <option>20000</option>
    </select>
    <label class="auto"><input type="checkbox" id="auto"> auto</label>
    <button class="primary" id="run">Run</button>
  </div>
  <div class="examples">
    <button data-q="level:error | sort by (_time) desc">errors</button>
    <button data-q='_msg:"timeout"'>timeouts</button>
    <button data-q='* | stats by (level) count() as total'>by level</button>
    <button data-q='* | stats by (service) count() as total | sort by (total) desc'>by service</button>
    <button data-q='_time:5m * | sort by (_time) desc'>recent</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="results" id="results"><div class="empty"><b>Ready</b>Run a query to explore your logs.</div></div>
</main>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const results = $("results");
  const meta = $("meta");
  const qInput = $("q");
  const runBtn = $("run");
  let busy = false;
  let timer = null;

  const shortTime = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const p = (n, w = 2) => String(n).padStart(w, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
  };

  const fmtNum = (n) => {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  };

  const fmtDuration = (s) => {
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
    return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
  };

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  function chip(name, value) {
    const c = el("span", "chip");
    const k = el("span", "k");
    const v = el("span", "v");
    k.textContent = name;
    v.textContent = value;
    c.title = name + "=" + value;
    if (name === "level" || name === "severity") {
      const lv = String(value).toLowerCase();
      if (lv.includes("err") || lv.includes("fatal") || lv === "crit") c.classList.add("lvl-error");
      else if (lv.includes("warn")) c.classList.add("lvl-warn");
      else if (lv.includes("info") || lv.includes("debug") || lv.includes("trace")) c.classList.add("lvl-info");
    }
    c.appendChild(k);
    c.appendChild(v);
    return c;
  }

  function render(rows, elapsedMs) {
    results.textContent = "";
    if (!rows.length) {
      const e = el("div", "empty");
      e.appendChild(el("b", "", "No logs match this query"));
      e.appendChild(document.createTextNode("Try a wider time range or a different filter."));
      results.appendChild(e);
      return;
    }
    const isLogs = Object.prototype.hasOwnProperty.call(rows[0], "_time");
    const table = el("table");
    const thead = el("thead");
    const hr = el("tr");
    let cols = [];
    if (isLogs) {
      cols = ["_time", "_msg"];
      const seen = new Set();
      const fieldKeys = [];
      for (const r of rows) {
        for (const k of Object.keys(r)) {
          if (k === "_time" || k === "_msg" || seen.has(k)) continue;
          seen.add(k);
          fieldKeys.push(k);
        }
      }
      for (const k of fieldKeys) cols.push(k);
    } else {
      const seen = new Set();
      for (const r of rows) for (const k of Object.keys(r)) if (!seen.has(k) && k !== "_msg" && k !== "_time") { seen.add(k); cols.push(k); }
    }
    for (const c of cols) {
      const th = el("th", "", c === "_time" ? "Time" : c === "_msg" ? "Message" : c);
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el("tbody");
    let shown = 0;
    for (const r of rows) {
      const tr = el("tr", isLogs ? "log" : "");
      const cells = [];
      for (const c of cols) {
        let td;
        const val = r[c];
        if (c === "_time") { td = el("td", "time", shortTime(val)); }
        else if (c === "_msg") { td = el("td", "msg", val === undefined ? "" : String(val)); }
        else if (val === undefined) { td = el("td", ""); }
        else if (typeof val === "object") { td = el("td", "str", JSON.stringify(val)); }
        else if (/^-?\d+(\.\d+)?$/.test(String(val))) { td = el("td", "num", String(val)); }
        else { td = el("td", "str", String(val)); }
        cells.push(td);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
      shown++;
      if (isLogs) {
        const detail = el("tr", "detail");
        const td = el("td");
        td.colSpan = cols.length;
        const pre = el("pre", "", JSON.stringify(r, null, 2));
        td.appendChild(pre);
        detail.appendChild(td);
        detail.style.display = "none";
        tbody.appendChild(detail);
        tr.addEventListener("click", () => {
          detail.style.display = detail.style.display === "none" ? "" : "none";
        });
      }
    }
    table.appendChild(tbody);
    results.appendChild(table);
    if (isLogs && shown) {
      const firstBodyRows = tbody.querySelectorAll("tr.log");
      if (firstBodyRows.length) firstBodyRows[0].classList.add("flash");
    }
  }

  async function loadStats() {
    try {
      const r = await fetch("/metrics", { cache: "no-store" });
      const text = await r.text();
      const m = {};
      for (const line of text.split("\n")) {
        if (!line || line[0] === "#") continue;
        const i = line.lastIndexOf(" ");
        if (i > 0) m[line.slice(0, i)] = Number(line.slice(i + 1));
        else m[line] = 0;
      }
      const parts = [
        `<b>${fmtNum(m.odlog_ingested_rows_total || 0)}</b> ingested`,
        `<b>${fmtNum(m.odlog_rows || 0)}</b> on disk`,
        `<b>${fmtNum(m.odlog_mem_rows || 0)}</b> in memory`,
        `<b>${m.odlog_parts || 0}</b> parts`,
        `<b>${fmtNum(m.odlog_disk_bytes || 0)}B</b> stored`,
        `uptime <b>${fmtDuration(m.odlog_uptime_seconds || 0)}</b>`,
      ];
      $("stats").innerHTML = parts.map((p) => `<span>${p}</span>`).join("");
    } catch (e) {
      $("stats").textContent = "offline";
    }
  }

  function showError(msg) {
    meta.textContent = "";
    const s = el("span", "err", "error: " + msg);
    meta.appendChild(s);
    results.textContent = "";
    const e = el("div", "empty");
    e.appendChild(el("b", "", "Query failed"));
    e.appendChild(document.createTextNode(String(msg)));
    results.appendChild(e);
  }

  async function run() {
    if (busy) return;
    busy = true;
    runBtn.disabled = true;
    const q = qInput.value.trim() || "*";
    const range = $("range").value;
    const limit = $("limit").value;
    const url = new URL("/select/logsql/query", location.origin);
    url.searchParams.set("query", q);
    url.searchParams.set("limit", limit);
    if (range !== "0") {
      url.searchParams.set("start", new Date(Date.now() - parseInt(range, 10) * 1000).toISOString());
    }
    const t0 = performance.now();
    try {
      const resp = await fetch(url, { cache: "no-store" });
      const text = await resp.text();
      if (!resp.ok) {
        let m = text;
        try { m = JSON.parse(text).error || text; } catch (_) {}
        throw new Error(m || ("HTTP " + resp.status));
      }
      const rows = [];
      for (const line of text.split("\n")) {
        if (line.length) {
          try { rows.push(JSON.parse(line)); } catch (_) {}
        }
      }
      const ms = Math.round(performance.now() - t0);
      render(rows, ms);
      const h = (name) => resp.headers.get(name) || "0";
      meta.textContent = "";
      const bits = [
        ["rows", rows.length],
        ["scanned", h("X-Odlog-Scanned-Rows")],
        ["matched", h("X-Odlog-Matched-Rows")],
        ["pruned blocks", h("X-Odlog-Pruned-Blocks")],
        ["server", h("X-Odlog-Elapsed-Ms") + " ms"],
        ["client", ms + " ms"],
      ];
      for (const [k, v] of bits) {
        const s = document.createElement("span");
        s.innerHTML = `${k} <b>${v}</b>`;
        meta.appendChild(s);
      }
      try { localStorage.setItem("odlog:query", q); } catch (_) {}
    } catch (e) {
      showError(e.message || String(e));
    } finally {
      busy = false;
      runBtn.disabled = false;
    }
  }

  function setAuto(on) {
    if (timer) { clearInterval(timer); timer = null; }
    if (on) timer = setInterval(() => { if (!document.hidden) run(); }, 5000);
  }

  runBtn.addEventListener("click", run);
  qInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); run(); }
  });
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
  });
  $("auto").addEventListener("change", (e) => setAuto(e.target.checked));
  document.querySelectorAll(".examples button").forEach((b) => {
    b.addEventListener("click", () => {
      qInput.value = b.dataset.q;
      run();
    });
  });
  try {
    const saved = localStorage.getItem("odlog:query");
    if (saved) qInput.value = saved;
  } catch (_) {}

  loadStats();
  setInterval(loadStats, 10000);
  run();
})();
</script>
</body>
</html>
